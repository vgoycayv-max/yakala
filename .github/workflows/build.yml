name: APK Derle
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android iskeletini olustur ve dosyalarimizi koy
        run: |
          flutter create --platforms=android --project-name yakala --org com.yakala .
          cp app_src/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp app_src/main.dart lib/main.dart
          rm -rf test
          python3 app_src/patch_manifest.py
      - run: flutter pub get
      - name: Eklenti uyumsuzlugunu duzelt (proguard)
        run: |
          find ~/.pub-cache -type f \( -name build.gradle -o -name build.gradle.kts \) -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Yakala-APK
          path: build/app/outputs/flutter-apk/app-release.apk
